[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nettoyage-excel"
version = "0.1.0"
description = "Nettoie un fichier de commandes Excel ou CSV : formats unifiés, doublons supprimés, lignes douteuses signalées."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
demo = ["pillow>=10"]

[project.scripts]
nettoyer-excel = "nettoyage_excel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
